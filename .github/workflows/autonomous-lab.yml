name: Autonomous Engineering Lab

on:
  schedule:
    - cron: "53 8 * * 3"
    - cron: "19 8 1 * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: autonomous-lab-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repo-medic:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '19 8 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/repo-medic.yml@v1.0.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install -r requirements-dev.txt
      test-command: >-
        python -m pytest -q

  documentation-scribe:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '19 8 1 * *'
    permissions:
      contents: read
      issues: write
    uses: asp53826/portfolio-ops/.github/workflows/documentation-scribe.yml@v1.0.0

  benchmark-keeper:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '19 8 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/benchmark-keeper.yml@v1.0.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install -r requirements-dev.txt
      preflight-command: >-
        python -m pytest -q
      benchmark-command: >-
        python bench/bench.py --requests 8 --max-seqs 4 --layers 2 --d-model 64 --d-ff 128 --repeat 1

  dependency-caretaker:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-caretaker.yml@v1.0.0

